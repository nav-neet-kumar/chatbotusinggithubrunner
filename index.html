<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Dolphin Mistral Chat</title>
<style>
*{box-sizing:border-box}body{margin:0;font:16px system-ui;background:#f6f7f9;color:#16181d;display:flex;flex-direction:column;height:100dvh}
header{padding:16px;text-align:center;background:#fff;border-bottom:1px solid #ddd}h1{font-size:20px;margin:0}#status{font-size:13px;color:#666;margin-top:5px}
#chat{width:min(850px,100%);margin:0 auto;padding:18px;overflow:auto;flex:1;display:flex;flex-direction:column;gap:12px}
.msg{max-width:85%;padding:12px 15px;border-radius:14px;white-space:pre-wrap;overflow-wrap:anywhere;line-height:1.5}.user{align-self:flex-end;background:#1769e0;color:#fff}.bot{align-self:flex-start;background:#e5e7eb}
form{padding:14px;background:#fff;border-top:1px solid #ddd;display:flex;gap:8px;justify-content:center}input{width:min(700px,80%);padding:13px;border:1px solid #bbb;border-radius:10px;font:inherit}button{padding:12px 18px;border:0;border-radius:10px;background:#1769e0;color:#fff;font-weight:600}button:disabled,input:disabled{opacity:.55}
</style>
</head>
<body>
<header><h1>Dolphin Mistral Chat</h1><div id="status">Checking temporary model server…</div></header>
<main id="chat"><div class="msg bot">Hello! Chat with dolphin-mistral. The status will change to Online only after the API is reachable.</div></main>
<form id="form"><input id="prompt" autocomplete="off" placeholder="Message Dolphin Mistral…" disabled><button id="send" disabled>Send</button></form>
<script>
const API_URL="https://content-softball-safer-monster.trycloudflare.com";
const MODEL="dolphin-mistral";
const chat=document.querySelector('#chat'),input=document.querySelector('#prompt'),send=document.querySelector('#send'),status=document.querySelector('#status');
const messages=[];
function add(t,r){const e=document.createElement('div');e.className='msg '+(r==='user'?'user':'bot');e.textContent=t;chat.appendChild(e);chat.scrollTop=chat.scrollHeight;return e}
function setOnline(online,detail){status.textContent=online?'Online · '+MODEL+' · temporary session':detail;input.disabled=!online;send.disabled=!online}
async function checkApi(){
 if(!API_URL.startsWith('https://')||API_URL.includes('https://content-softball-safer-monster.trycloudflare.com')){setOnline(false,'Waiting for a new GitHub Actions tunnel…');return}
 setOnline(false,'Checking temporary model server…');
 try{const r=await fetch(API_URL+'/api/tags',{method:'GET',cache:'no-store'});if(!r.ok)throw Error('HTTP '+r.status);const d=await r.json();if(!(d.models||[]).some(m=>(m.name||'').startsWith(MODEL)))throw Error('Model not found on server');setOnline(true,'')}
 catch(e){setOnline(false,'Offline · tunnel not reachable ('+e.message+')')}
}
document.querySelector('#form').addEventListener('submit',async e=>{
 e.preventDefault();const t=input.value.trim();if(!t||input.disabled)return;input.value='';input.disabled=true;send.disabled=true;
 messages.push({role:'user',content:t});add(t,'user');const reply=add('Thinking…','assistant');
 try{const r=await fetch(API_URL+'/api/chat',{method:'POST',headers:{'Content-Type':'text/plain;charset=UTF-8'},body:JSON.stringify({model:MODEL,messages,stream:false})});if(!r.ok)throw Error('HTTP '+r.status);const d=await r.json(),a=d.message?.content||'No response returned.';reply.textContent=a;messages.push({role:'assistant',content:a});setOnline(true,'')}
 catch(err){reply.textContent='Could not reach temporary model server: '+err.message+'. Check the latest GitHub Actions run.';setOnline(false,'Offline · tunnel not reachable')}
});
checkApi();
</script>
</body></html>
