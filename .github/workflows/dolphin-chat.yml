name: Dolphin Mistral Temporary Chat

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  chat:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Install Ollama
        run: |
          curl -fsSL https://ollama.com/install.sh | sh
          OLLAMA_HOST=127.0.0.1:11434 OLLAMA_ORIGINS='*' ollama serve > ollama.log 2>&1 &
          for i in {1..40}; do curl -fsS http://127.0.0.1:11434/api/tags >/dev/null && break; sleep 2; done
          curl -fsS http://127.0.0.1:11434/api/tags >/dev/null
      - name: Pull only dolphin-mistral
        run: ollama pull dolphin-mistral
      - name: Start tunnel and publish UI URL
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          curl -fsSL -o cloudflared.deb https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64.deb
          sudo dpkg -i cloudflared.deb
          cloudflared tunnel --no-autoupdate --url http://127.0.0.1:11434 > tunnel.log 2>&1 &
          for i in {1..40}; do TUNNEL_URL=$(grep -oE 'https://[a-zA-Z0-9.-]+\.trycloudflare\.com' tunnel.log | head -n 1 || true); [ -n "$TUNNEL_URL" ] && break; sleep 2; done
          if [ -z "${TUNNEL_URL:-}" ]; then cat tunnel.log; exit 1; fi
          echo "Temporary Ollama API URL: $TUNNEL_URL"
          for i in {1..20}; do if curl -fsS "$TUNNEL_URL/api/tags" >/tmp/tags.json; then break; fi; sleep 2; done
          cat /tmp/tags.json
          sed -i "s|__TUNNEL_URL__|$TUNNEL_URL|g" index.html
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'Publish temporary Dolphin Mistral endpoint' || true
          git push https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git HEAD:${GITHUB_REF_NAME}
          echo 'Warning: this exposes the Ollama API publicly while the workflow runs. Stop the workflow when finished; do not send sensitive data.'
          sleep 3300
      - name: Diagnostics
        if: failure()
        run: cat ollama.log tunnel.log || true
