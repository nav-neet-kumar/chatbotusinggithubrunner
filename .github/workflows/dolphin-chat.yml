name: Dolphin Mistral Temporary Chat

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  chat:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Install Ollama
        run: |
          curl -fsSL https://ollama.com/install.sh | sh
          OLLAMA_HOST=127.0.0.1:11434 OLLAMA_ORIGINS='*' ollama serve > ollama.log 2>&1 &
          for i in {1..40}; do curl -fsS http://127.0.0.1:11434/api/tags >/dev/null && break; sleep 2; done
          curl -fsS http://127.0.0.1:11434/api/tags >/dev/null
      - name: Pull only dolphin-mistral
        run: ollama pull dolphin-mistral
      - name: Start tunnel and publish UI URL
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          curl -fsSL -o cloudflared.deb https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64.deb
          sudo dpkg -i cloudflared.deb
          cloudflared tunnel --no-autoupdate --http-host-header 127.0.0.1:11434 --url http://127.0.0.1:11434 > tunnel.log 2>&1 &
          for i in {1..40}; do TUNNEL_URL=$(grep -oE 'https://[a-zA-Z0-9.-]+\.trycloudflare\.com' tunnel.log | head -n 1 || true); [ -n "$TUNNEL_URL" ] && break; sleep 2; done
          if [ -z "${TUNNEL_URL:-}" ]; then cat tunnel.log; exit 1; fi
          echo "Temporary Ollama API URL: $TUNNEL_URL"
          HEALTHY=0
          for i in {1..30}; do
            HTTP_CODE=$(curl -sS -o /tmp/tags.json -w '%{http_code}' "$TUNNEL_URL/api/tags" || true)
            if [ "$HTTP_CODE" = "200" ] && grep -q 'dolphin-mistral' /tmp/tags.json; then HEALTHY=1; break; fi
            echo "Tunnel health attempt $i returned HTTP ${HTTP_CODE:-no-response}"
            sleep 3
          done
          if [ "$HEALTHY" != "1" ]; then echo 'Tunnel API health check failed; refusing to publish a broken endpoint.'; cat tunnel.log; cat /tmp/tags.json || true; exit 1; fi
          cat /tmp/tags.json
          # Replace both the original placeholder and any URL published by a previous run.
          sed -i -E "s|https://[A-Za-z0-9.-]+\\.trycloudflare\\.com|$TUNNEL_URL|g; s|__TUNNEL_URL__|$TUNNEL_URL|g" index.html
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'Publish temporary Dolphin Mistral endpoint' || true
          git push https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git HEAD:${GITHUB_REF_NAME}
          echo 'Warning: this exposes the Ollama API publicly while the workflow runs. Stop the workflow when finished; do not send sensitive data.'
          sleep 3300
      - name: Diagnostics
        if: failure()
        run: cat ollama.log tunnel.log || true
