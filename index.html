<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Dolphin Mistral Chat</title><style>*{box-sizing:border-box}body{margin:0;font:16px system-ui;background:#f6f7f9;color:#16181d;display:flex;flex-direction:column;height:100dvh}header{padding:16px;text-align:center;background:#fff;border-bottom:1px solid #ddd}h1{font-size:20px;margin:0}#status{font-size:13px;color:#666;margin-top:5px}#chat{width:min(850px,100%);margin:0 auto;padding:18px;overflow:auto;flex:1;display:flex;flex-direction:column;gap:12px}.msg{max-width:85%;padding:12px 15px;border-radius:14px;white-space:pre-wrap;overflow-wrap:anywhere;line-height:1.5}.user{align-self:flex-end;background:#1769e0;color:#fff}.bot{align-self:flex-start;background:#e5e7eb}form{padding:14px;background:#fff;border-top:1px solid #ddd;display:flex;gap:8px;justify-content:center}input{width:min(700px,80%);padding:13px;border:1px solid #bbb;border-radius:10px;font:inherit}button{padding:12px 18px;border:0;border-radius:10px;background:#1769e0;color:#fff;font-weight:600}button:disabled,input:disabled{opacity:.55}</style></head><body><header><h1>Dolphin Mistral Chat</h1><div id="status">Waiting for temporary model server…</div></header><main id="chat"><div class="msg bot">Hello! Chat with dolphin-mistral. Start the GitHub Actions workflow to connect.</div></main><form id="form"><input id="prompt" autocomplete="off" placeholder="Message Dolphin Mistral…" disabled><button id="send" disabled>Send</button></form><script>
const API_URL="https://joyce-basic-perry-commentary.trycloudflare.com";const MODEL="dolphin-mistral";const chat=document.querySelector('#chat'),input=document.querySelector('#prompt'),send=document.querySelector('#send'),status=document.querySelector('#status');const messages=[];function add(t,r){const e=document.createElement('div');e.className='msg '+(r==='user'?'user':'bot');e.textContent=t;chat.appendChild(e);chat.scrollTop=chat.scrollHeight;return e}if(API_URL.startsWith('https://')){status.textContent='Model: '+MODEL+' · temporary session';input.disabled=false;send.disabled=false}else status.textContent='Offline · start the GitHub Actions workflow';document.querySelector('#form').addEventListener('submit',async e=>{e.preventDefault();const t=input.value.trim();if(!t)return;input.value='';input.disabled=true;send.disabled=true;messages.push({role:'user',content:t});add(t,'user');const reply=add('Thinking…','assistant');try{const r=await fetch(API_URL+'/api/chat',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({model:MODEL,messages,stream:false})});if(!r.ok)throw Error('HTTP '+r.status);const d=await r.json(),a=d.message?.content||'No response returned.';reply.textContent=a;messages.push({role:'assistant',content:a})}catch(err){reply.textContent='Could not reach temporary model server: '+err.message+'. Check GitHub Actions.'}finally{input.disabled=false;send.disabled=false;input.focus()}});
</script></body></html>
