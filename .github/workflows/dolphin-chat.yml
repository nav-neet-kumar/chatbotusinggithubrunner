name: Bonsai 2 Uncensored 27B Chat

on:
  workflow_dispatch:
  # Automatically run the repaired workflow when this workflow file is updated.
  push:
    branches:
      - main
    paths:
      - .github/workflows/dolphin-chat.yml

permissions:
  contents: write

concurrency:
  group: eriktonon/bonsai-2-uncensored:27b-temporary-chat
  cancel-in-progress: true

jobs:
  chat:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Ollama and configure browser access
        shell: bash
        run: |
          set -Eeuo pipefail
          curl -fsSL --retry 5 --retry-all-errors --retry-delay 2 https://ollama.com/install.sh | sh

          # The Linux installer commonly creates a systemd service. Configure that
          # service itself so the process actually serving port 11434 has CORS enabled.
          if command -v systemctl >/dev/null 2>&1 && sudo systemctl cat ollama.service >/dev/null 2>&1; then
            sudo mkdir -p /etc/systemd/system/ollama.service.d
            printf '%s\n' \
              '[Service]' \
              'Environment="OLLAMA_HOST=127.0.0.1:11434"' \
              'Environment="OLLAMA_ORIGINS=*"' \
              | sudo tee /etc/systemd/system/ollama.service.d/override.conf >/dev/null
            sudo systemctl daemon-reload
            sudo systemctl restart ollama
            echo 'Ollama configured through its systemd service with browser CORS enabled.'
          else
            # Fallback for runners without the installer-managed systemd service.
            OLLAMA_HOST=127.0.0.1:11434 OLLAMA_ORIGINS='*' ollama serve > ollama.log 2>&1 &
            echo $! > ollama.pid
          fi

          for i in {1..60}; do
            if curl --connect-timeout 2 --max-time 5 -fsS http://127.0.0.1:11434/api/tags >/dev/null; then
              echo 'Ollama API is ready on 127.0.0.1:11434.'
              exit 0
            fi
            sleep 2
          done
          echo 'Ollama did not become ready.'
          sudo journalctl -u ollama --no-pager -n 100 || true
          cat ollama.log || true
          exit 1

      - name: Download Dolphin Mistral
        shell: bash
        run: |
          set -Eeuo pipefail
          ollama pull eriktonon/bonsai-2-uncensored:27b
          ollama show eriktonon/bonsai-2-uncensored:27b >/dev/null
          echo 'eriktonon/bonsai-2-uncensored:27b is installed.'

      - name: Verify local chat API before exposing it
        shell: bash
        run: |
          set -Eeuo pipefail
          CHAT_REQUEST='{"model":"eriktonon/bonsai-2-uncensored:27b","messages":[{"role":"user","content":"Reply with the single word OK."}],"stream":false}'
          rm -f /tmp/local-chat.json
          HTTP_CODE=$(curl --connect-timeout 5 --max-time 240 -sS \
            -o /tmp/local-chat.json -w '%{http_code}' \
            -H 'Content-Type: application/json' \
            --data "$CHAT_REQUEST" http://127.0.0.1:11434/api/chat || true)
          if [ "$HTTP_CODE" != '200' ] || ! jq -e '.message.content | strings | length > 0' /tmp/local-chat.json >/dev/null; then
            echo "Local /api/chat smoke test failed with HTTP ${HTTP_CODE:-000}."
            cat /tmp/local-chat.json || true
            sudo journalctl -u ollama --no-pager -n 100 || true
            cat ollama.log || true
            exit 1
          fi
          echo 'PASS: local /api/chat generated a response.'

      - name: Install Cloudflare Tunnel
        shell: bash
        run: |
          set -Eeuo pipefail
          curl -fsSL --retry 5 --retry-all-errors --retry-delay 2 \
            -o cloudflared.deb \
            https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64.deb
          sudo dpkg -i cloudflared.deb
          cloudflared --version

      - name: Start tunnel, verify public chat, and publish page
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail

          LOCAL_TAGS=$(curl --connect-timeout 3 --max-time 10 -fsS http://127.0.0.1:11434/api/tags)
          echo "$LOCAL_TAGS" | grep -q 'eriktonon/bonsai-2-uncensored:27b' || {
            echo 'The local Ollama API does not list eriktonon/bonsai-2-uncensored:27b.'
            exit 1
          }

          cloudflared tunnel --no-autoupdate --protocol http2 \
            --http-host-header 127.0.0.1:11434 \
            --url http://127.0.0.1:11434 > tunnel.log 2>&1 &
          echo $! > cloudflared.pid

          TUNNEL_URL=''
          for i in {1..60}; do
            TUNNEL_URL=$(grep -oE 'https://[a-zA-Z0-9.-]+\.trycloudflare\.com' tunnel.log | head -n 1 || true)
            if [ -n "$TUNNEL_URL" ]; then break; fi
            if ! kill -0 "$(cat cloudflared.pid)" 2>/dev/null; then
              echo 'cloudflared exited before creating a tunnel.'
              cat tunnel.log
              exit 1
            fi
            sleep 2
          done
          if [ -z "$TUNNEL_URL" ]; then
            echo 'Cloudflare did not provide a Quick Tunnel URL.'
            cat tunnel.log
            exit 1
          fi
          echo "Quick Tunnel created: $TUNNEL_URL"

          # Wait for DNS and the HTTPS path to become available. Never reuse stale JSON.
          HEALTHY=0
          for i in {1..60}; do
            rm -f /tmp/public-tags.json
            HTTP_CODE=$(curl --connect-timeout 5 --max-time 15 --retry 1 --retry-all-errors --retry-delay 2 \
              -sS -o /tmp/public-tags.json -w '%{http_code}' \
              "$TUNNEL_URL/api/tags" || true)
            if [ "$HTTP_CODE" = '200' ] && grep -q 'eriktonon/bonsai-2-uncensored:27b' /tmp/public-tags.json; then
              HEALTHY=1
              break
            fi
            echo "Public API readiness check $i/60: HTTP ${HTTP_CODE:-000}; retrying."
            sleep 5
          done
          if [ "$HEALTHY" != '1' ]; then
            echo 'Public API health check failed; endpoint will not be published.'
            cat tunnel.log || true
            sudo journalctl -u ollama --no-pager -n 100 || true
            cat ollama.log || true
            exit 1
          fi
          echo 'PASS: public HTTPS /api/tags returned eriktonon/bonsai-2-uncensored:27b.'

          # Test the exact text/plain POST used by index.html and a GitHub Pages Origin.
          CHAT_REQUEST='{"model":"eriktonon/bonsai-2-uncensored:27b","messages":[{"role":"user","content":"Reply with the single word OK."}],"stream":false}'
          rm -f /tmp/public-chat.json /tmp/public-chat.headers
          CHAT_CODE=$(curl --connect-timeout 5 --max-time 240 -sS \
            -D /tmp/public-chat.headers -o /tmp/public-chat.json -w '%{http_code}' \
            -H 'Origin: https://nav-neet-kumar.github.io' \
            -H 'Content-Type: text/plain;charset=UTF-8' \
            --data "$CHAT_REQUEST" "$TUNNEL_URL/api/chat" || true)
          if [ "$CHAT_CODE" != '200' ] || ! jq -e '.message.content | strings | length > 0' /tmp/public-chat.json >/dev/null; then
            echo "Public /api/chat smoke test failed with HTTP ${CHAT_CODE:-000}."
            cat /tmp/public-chat.json || true
            cat /tmp/public-chat.headers || true
            cat tunnel.log || true
            exit 1
          fi
          if ! grep -qiE '^access-control-allow-origin: (\*|https://nav-neet-kumar\.github\.io)[[:space:]]*$' /tmp/public-chat.headers; then
            echo 'Public chat response does not include the expected CORS allow-origin header.'
            cat /tmp/public-chat.headers
            exit 1
          fi
          echo 'PASS: public /api/chat generated a response and returned the expected CORS header.'

          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'

          # Sync latest main before each push so a Pages build or concurrent commit is safe.
          PUBLISHED=0
          for attempt in {1..5}; do
            git fetch origin "$GITHUB_REF_NAME"
            git reset --hard "origin/$GITHUB_REF_NAME"
            sed -i -E \
              "s|https://[A-Za-z0-9.-]+\\.trycloudflare\\.com|$TUNNEL_URL|g; s|__TUNNEL_URL__|$TUNNEL_URL|g" \
              index.html

            if ! grep -Fq "const PUBLISHED_API_URL = \"$TUNNEL_URL\";" index.html; then
              echo 'Failed to place the current verified endpoint in the root index.html.'
              exit 1
            fi

            git add index.html
            if ! git diff --cached --quiet; then
              git commit -m 'Publish verified temporary Dolphin Mistral endpoint for root page'
            fi

            if git push "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "HEAD:${GITHUB_REF_NAME}"; then
              PUBLISHED=1
              echo "Published verified chat endpoint: $TUNNEL_URL"
              break
            fi
            echo "Push race (attempt $attempt/5); syncing and retrying."
            sleep 3
          done

          if [ "$PUBLISHED" != '1' ]; then
            echo 'Could not publish after five attempts.'
            exit 1
          fi

          echo 'The temporary Ollama API is public while this workflow runs. Do not submit sensitive data.'
          sleep 3300

      - name: Diagnostics on failure
        if: failure()
        shell: bash
        run: |
          echo '--- Ollama service ---'
          sudo journalctl -u ollama --no-pager -n 100 || true
          echo '--- Ollama process log (fallback mode) ---'
          cat ollama.log || true
          echo '--- Cloudflare tunnel log ---'
          cat tunnel.log || true
